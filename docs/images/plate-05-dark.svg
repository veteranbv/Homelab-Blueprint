<?xml version="1.0" encoding="UTF-8"?>
<svg class="plate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-plate-05 desc-plate-05" data-plate="plate-05" data-theme="dark" data-failure="none" preserveAspectRatio="xMidYMid meet"><title id="title-plate-05">Plate 05, The loop, field note</title><desc id="desc-plate-05">The agent came last. It uses the same typed operations a person already trusts. Policy decides. Live verification closes the record. A workshop bench diagram. On the left, a stack of typed tool cards lists the name, input, preview mode, and risk class of the operations an agent may propose. In the middle, a rectangular pipeline runs from observe to reconcile, preview, constrain, verify, and record. A policy gate diamond sits in the middle of the pipeline, stamped human or policy. On the right, a ruled ledger page shows the invariant columns of an audit record: timestamp, operation class, target class, preview delta, decision, and verification. The ledger is marked example record synthetic. A first-person field note runs above.</desc><defs><style>
    .plate-paper { fill: #12141A; }
    .plate-paper-tint { fill: #191C24; }
    .plate-paper-elevated { fill: #20242E; }
    .plate-ink { fill: #F0EAD8; }
    .plate-ink-soft { fill: #95917E; }
    .plate-warn { fill: #E6704F; }
    .plate-verify { fill: #7AC0A0; }
    .plate-stroke { stroke: #F0EAD8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-soft { stroke: #95917E; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-hairline { stroke: #40434D; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-warn { stroke: #E6704F; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-verify { stroke: #7AC0A0; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-fill-paper { fill: #12141A; }
    .plate-fill-tint { fill: #191C24; }
    .plate-fill-elevated { fill: #20242E; }
    .w05 { stroke-width: 0.6; }
    .w1  { stroke-width: 1.1; }
    .w15 { stroke-width: 1.6; }
    .w25 { stroke-width: 2.4; }
    .w4  { stroke-width: 3.6; }
    .t-plate-number { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; fill: #F0EAD8; }
    .t-plate-name   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #95917E; }
    .t-plate-title  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; fill: #F0EAD8; }
    .t-teaching     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 19px; fill: #F0EAD8; }
    .t-revision     { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; letter-spacing: 0.08em; fill: #95917E; }
    .t-callout      { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 15px; fill: #F0EAD8; }
    .t-label        { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #F0EAD8; }
    .t-label-soft   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #95917E; }
    .t-body         { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #F0EAD8; }
    .t-body-soft    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #95917E; }
    .t-mono         { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #F0EAD8; }
    .t-mono-soft    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #95917E; }
    .t-mono-small   { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 10px; fill: #95917E; letter-spacing: 0.06em; }
    .t-stamp        { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .t-question     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 28px; fill: #F0EAD8; }
    .t-question-hint{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 12px; letter-spacing: 0.02em; fill: #95917E; }
    .t-destination  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 15px; font-weight: 700; letter-spacing: 0.06em; fill: #F0EAD8; }
    .t-consequence  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 13px; fill: #95917E; }
    .t-footer       { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 17px; fill: #F0EAD8; }
    .t-anchor       { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; fill: #F0EAD8; letter-spacing: 0.02em; }
    .fade-in        { opacity: 1;  }
    .fade-in.d-1    { animation-delay: 260ms; }
    .fade-in.d-2    { animation-delay: 340ms; }
    .fade-in.d-3    { animation-delay: 420ms; }
    .fade-in.d-4    { animation-delay: 500ms; }
    .fade-in.d-5    { animation-delay: 580ms; }
    .cursor         {  }
    .failure-stamp  { transform-origin: center;  }
    @keyframes plate-fade { to { opacity: 1; } }
    @keyframes plate-blink { 50% { opacity: 0; } }
    @keyframes plate-stamp { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .failure-stamp { animation: none !important; opacity: 1 !important; }
      .cursor { animation: none !important; }
    }
  </style><filter id="ink-plate-05" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="0.45"></feDisplacementMap></filter><pattern id="grid-plate-05" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 16 0 L 0 0 0 16" stroke="#40434D" stroke-opacity="0.22" stroke-width="0.5" fill="none"></path></pattern></defs><rect width="1600" height="1000" class="plate-paper"></rect><rect x="48" y="48" width="1504" height="904" fill="url(#grid-plate-05)"></rect><g class="title-block"><line x1="48" y1="108" x2="1552" y2="108" class="plate-stroke w1"></line><text x="48" y="74" class="t-plate-number">PLATE 05</text><text x="48" y="96" class="t-plate-name">Bounded automation</text><text x="1552" y="74" text-anchor="end" class="t-plate-title">The loop, field note</text><g><rect x="1384" y="82" width="168" height="22" fill="none" class="plate-stroke-soft w1"></rect><text x="1468" y="98" text-anchor="middle" class="t-revision">REV 2026-07</text></g></g><g filter="url(#ink-plate-05)" class="plate-body"><g><text x="48" y="144" class="t-label-soft">FIELD NOTE</text><line x1="48" y1="150" x2="88" y2="150" class="plate-stroke w15"></line><text x="48" y="174" class="t-teaching">I did not give a model shell access on day one.</text><text x="48" y="198" class="t-teaching">I gave it read-only observation, then the same typed operations I already trusted.</text><text x="48" y="222" class="t-teaching">The ledger below is the shape of that trust, not a record of any real system.</text><text x="1552" y="174" text-anchor="end" class="t-mono-small">THE OWNER, 2026 REVIEW</text></g><g><text x="48" y="254" class="t-label-soft">TYPED TOOLS</text><text x="384" y="254" text-anchor="end" class="t-mono-small">RISK-CLASSIFIED</text><g class="fade-in d-1"><rect x="48" y="268" width="336" height="84" class="plate-stroke w15 plate-fill-elevated"></rect><text x="64" y="294" class="t-mono">svc.status</text><text x="368" y="294" text-anchor="end" class="t-mono-small">READ</text><line x1="64" y1="306" x2="368" y2="306" class="plate-stroke-hairline w05"></line><text x="64" y="326" class="t-body-soft">ask a service how it is doing</text><text x="64" y="342" class="t-body-soft"><tspan class="t-label-soft">preview </tspan><tspan>n/a</tspan></text></g><g class="fade-in d-2"><rect x="48" y="364" width="336" height="84" class="plate-stroke w15 plate-fill-elevated"></rect><text x="64" y="390" class="t-mono">svc.logs.tail</text><text x="368" y="390" text-anchor="end" class="t-mono-small">READ</text><line x1="64" y1="402" x2="368" y2="402" class="plate-stroke-hairline w05"></line><text x="64" y="422" class="t-body-soft">read recent lines from one service log</text><text x="64" y="438" class="t-body-soft"><tspan class="t-label-soft">preview </tspan><tspan>n/a</tspan></text></g><g class="fade-in d-3"><rect x="48" y="460" width="336" height="84" class="plate-stroke w15 plate-fill-elevated"></rect><text x="64" y="486" class="t-mono">svc.restart</text><text x="368" y="486" text-anchor="end" class="t-mono-small">REVERSIBLE</text><line x1="64" y1="498" x2="368" y2="498" class="plate-stroke-hairline w05"></line><text x="64" y="518" class="t-body-soft">restart one service with a preview</text><text x="64" y="534" class="t-body-soft"><tspan class="t-label-soft">preview </tspan><tspan>required</tspan></text></g><g class="fade-in d-4"><rect x="48" y="556" width="336" height="84" class="plate-stroke w15 plate-fill-elevated"></rect><text x="64" y="582" class="t-mono">backup.verify</text><text x="368" y="582" text-anchor="end" class="t-mono-small">REVERSIBLE</text><line x1="64" y1="594" x2="368" y2="594" class="plate-stroke-hairline w05"></line><text x="64" y="614" class="t-body-soft">ask the repo to prove a snapshot restores</text><text x="64" y="630" class="t-body-soft"><tspan class="t-label-soft">preview </tspan><tspan>always</tspan></text></g><g class="fade-in d-5"><rect x="48" y="652" width="336" height="84" class="plate-stroke w15 plate-fill-elevated"></rect><text x="64" y="678" class="t-mono">net.route.add</text><text x="368" y="678" text-anchor="end" class="t-mono-small">DESTRUCTIVE</text><line x1="64" y1="690" x2="368" y2="690" class="plate-stroke-hairline w05"></line><text x="64" y="710" class="t-body-soft">add one documented route with approval</text><text x="64" y="726" class="t-body-soft"><tspan class="t-label-soft">preview </tspan><tspan>always</tspan></text></g></g><g><text x="416" y="252" class="t-label-soft">THE LOOP</text><text x="948" y="252" text-anchor="end" class="t-mono-small">READ BROAD, CHANGE NARROW</text><g><rect x="416" y="274" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="428" y="294" class="t-mono-small">01</text><text x="494" y="319" text-anchor="middle" class="t-label">OBSERVE</text></g><g><rect x="604" y="274" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="616" y="294" class="t-mono-small">02</text><text x="682" y="319" text-anchor="middle" class="t-label">RECONCILE</text></g><g><rect x="792" y="274" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="804" y="294" class="t-mono-small">03</text><text x="870" y="319" text-anchor="middle" class="t-label">PREVIEW</text></g><g><rect x="792" y="620" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="804" y="640" class="t-mono-small">04</text><text x="870" y="665" text-anchor="middle" class="t-label">CONSTRAIN</text></g><g><rect x="604" y="620" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="616" y="640" class="t-mono-small">05</text><text x="682" y="665" text-anchor="middle" class="t-label">VERIFY</text></g><g><rect x="416" y="620" width="156" height="74" class="plate-stroke w25 plate-fill-elevated"></rect><text x="428" y="640" class="t-mono-small">06</text><text x="494" y="665" text-anchor="middle" class="t-label">RECORD</text></g><g><line x1="572" y1="311" x2="596" y2="311" class="plate-stroke w1"></line><polygon points="594,306 604,311 594,316" class="plate-ink"></polygon></g><g><line x1="760" y1="311" x2="784" y2="311" class="plate-stroke w1"></line><polygon points="782,306 792,311 782,316" class="plate-ink"></polygon></g><g><line x1="870" y1="348" x2="870" y2="612" class="plate-stroke w1"></line><polygon points="865,610 870,620 875,610" class="plate-ink"></polygon></g><g><line x1="792" y1="657" x2="768" y2="657" class="plate-stroke w1"></line><polygon points="770,652 760,657 770,662" class="plate-ink"></polygon></g><g><line x1="604" y1="657" x2="580" y2="657" class="plate-stroke w1"></line><polygon points="582,652 572,657 582,662" class="plate-ink"></polygon></g><g><line x1="494" y1="620" x2="494" y2="356" class="plate-stroke w1"></line><polygon points="489,358 494,348 499,358" class="plate-ink"></polygon></g><g transform="translate(682 484)"><path d="M 0 -70 L 96 0 L 0 70 L -96 0 Z" class="plate-stroke w25 plate-fill-elevated"></path><text y="-8" text-anchor="middle" class="t-label">POLICY GATE</text><text y="16" text-anchor="middle" class="t-mono-small">HUMAN or POLICY</text><text y="36" text-anchor="middle" class="t-body-soft">decides what runs</text></g><g><text x="416" y="738" class="t-label-soft">EACH STEP, ONE JOB</text><line x1="416" y1="748" x2="948" y2="748" class="plate-stroke-hairline w05"></line><g><text x="416" y="772" class="t-mono-small">01  OBSERVE</text><text x="416" y="790" class="t-body-soft">read authoritative and live sources</text></g><g><text x="716" y="772" class="t-mono-small">02  RECONCILE</text><text x="716" y="790" class="t-body-soft">name the difference between them</text></g><g><text x="416" y="816" class="t-mono-small">03  PREVIEW</text><text x="416" y="834" class="t-body-soft">return the exact proposed change</text></g><g><text x="716" y="816" class="t-mono-small">04  CONSTRAIN</text><text x="716" y="834" class="t-body-soft">policy and typed tools decide</text></g><g><text x="416" y="860" class="t-mono-small">05  VERIFY</text><text x="416" y="878" class="t-body-soft">prove the live outcome</text></g><g><text x="716" y="860" class="t-mono-small">06  RECORD</text><text x="716" y="878" class="t-body-soft">write the durable evidence</text></g></g></g><g><text x="1000" y="254" class="t-label-soft">AUDIT LEDGER</text><text x="1552" y="254" text-anchor="end" class="t-stamp plate-warn" fill="#E6704F">EXAMPLE RECORD, SYNTHETIC</text><rect x="1000" y="268" width="552" height="580" class="plate-stroke w15 plate-fill-elevated"></rect><line x1="1020" y1="308" x2="1532" y2="308" class="plate-stroke-hairline w05"></line><text x="1020" y="296" class="t-label">COLUMNS OF THE RECORD</text><g class="fade-in d-1"><text x="1020" y="342" class="t-label-soft">TIMESTAMP</text><text x="1020" y="364" class="t-mono">YYYY-MM-DD HH:MM:SS</text><text x="1020" y="384" class="t-body-soft">A time a person can find, not just an id.</text><line x1="1020" y1="398" x2="1532" y2="398" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-2"><text x="1020" y="424" class="t-label-soft">OPERATION</text><text x="1020" y="446" class="t-mono">svc.restart</text><text x="1020" y="466" class="t-body-soft">The name of the typed tool, not free text.</text><line x1="1020" y1="480" x2="1532" y2="480" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-3"><text x="1020" y="506" class="t-label-soft">TARGET CLASS</text><text x="1020" y="528" class="t-mono">WEB TIER, 1 OF 3</text><text x="1020" y="548" class="t-body-soft">A role and count, never a hostname.</text><line x1="1020" y1="562" x2="1532" y2="562" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-4"><text x="1020" y="588" class="t-label-soft">PREVIEW DELTA</text><text x="1020" y="610" class="t-mono">+1 unit, 0 config drift</text><text x="1020" y="630" class="t-body-soft">The exact change the preview promised.</text><line x1="1020" y1="644" x2="1532" y2="644" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-5"><text x="1020" y="670" class="t-label-soft">DECISION</text><text x="1020" y="692" class="t-mono">HUMAN or POLICY id</text><text x="1020" y="712" class="t-body-soft">Who or which policy said yes, and why.</text><line x1="1020" y1="726" x2="1532" y2="726" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-5"><text x="1020" y="752" class="t-label-soft">VERIFICATION</text><text x="1020" y="774" class="t-mono">smoke: pass</text><text x="1020" y="794" class="t-body-soft">The smoke test that closed the record.</text><line x1="1020" y1="808" x2="1532" y2="808" class="plate-stroke-hairline w05"></line></g><g><text x="1020" y="816" class="t-mono">next record ready</text><rect x="1176" y="804" width="8" height="14" class="cursor plate-ink"></rect></g></g><g><text x="800" y="936" text-anchor="middle" class="t-footer">Models propose. Policy decides. Typed tools constrain. Verified live state closes the record.</text></g></g></svg>
