<?xml version="1.0" encoding="UTF-8"?>
<svg class="plate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-plate-02 desc-plate-02" data-plate="plate-02" data-theme="dark" data-failure="none" preserveAspectRatio="xMidYMid meet"><title id="title-plate-02">Plate 02, One useful host</title><desc id="desc-plate-02">One box, one service, one owner. One backup on another failure domain. One restore that has worked. One alert path that reaches you. An elevation of a small maintainable service host on a shelf. Above the host, a stick figure labelled tenant represents the person the service is for. To the right of the host, a dashed line crosses a failure-domain boundary and ends at a network-attached storage elevation with two disk slots. Under everything, a restore ledger shows the invariant shape of a restore record: date, source, target, checksum result, and elapsed time. The ledger is marked example record synthetic. Right-margin annotations name the meaning of each element.</desc><defs><style>
    .plate-paper { fill: #12141A; }
    .plate-paper-tint { fill: #191C24; }
    .plate-paper-elevated { fill: #20242E; }
    .plate-ink { fill: #F0EAD8; }
    .plate-ink-soft { fill: #95917E; }
    .plate-warn { fill: #E6704F; }
    .plate-verify { fill: #7AC0A0; }
    .plate-stroke { stroke: #F0EAD8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-soft { stroke: #95917E; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-hairline { stroke: #40434D; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-warn { stroke: #E6704F; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-verify { stroke: #7AC0A0; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-fill-paper { fill: #12141A; }
    .plate-fill-tint { fill: #191C24; }
    .plate-fill-elevated { fill: #20242E; }
    .w05 { stroke-width: 0.6; }
    .w1  { stroke-width: 1.1; }
    .w15 { stroke-width: 1.6; }
    .w25 { stroke-width: 2.4; }
    .w4  { stroke-width: 3.6; }
    .t-plate-number { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; fill: #F0EAD8; }
    .t-plate-name   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #95917E; }
    .t-plate-title  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; fill: #F0EAD8; }
    .t-teaching     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 19px; fill: #F0EAD8; }
    .t-revision     { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; letter-spacing: 0.08em; fill: #95917E; }
    .t-callout      { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 15px; fill: #F0EAD8; }
    .t-label        { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #F0EAD8; }
    .t-label-soft   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #95917E; }
    .t-body         { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #F0EAD8; }
    .t-body-soft    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #95917E; }
    .t-mono         { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #F0EAD8; }
    .t-mono-soft    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #95917E; }
    .t-mono-small   { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 10px; fill: #95917E; letter-spacing: 0.06em; }
    .t-stamp        { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .t-question     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 28px; fill: #F0EAD8; }
    .t-question-hint{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 12px; letter-spacing: 0.02em; fill: #95917E; }
    .t-destination  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 15px; font-weight: 700; letter-spacing: 0.06em; fill: #F0EAD8; }
    .t-consequence  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 13px; fill: #95917E; }
    .t-footer       { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 17px; fill: #F0EAD8; }
    .t-anchor       { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; fill: #F0EAD8; letter-spacing: 0.02em; }
    .fade-in        { opacity: 1;  }
    .fade-in.d-1    { animation-delay: 260ms; }
    .fade-in.d-2    { animation-delay: 340ms; }
    .fade-in.d-3    { animation-delay: 420ms; }
    .fade-in.d-4    { animation-delay: 500ms; }
    .fade-in.d-5    { animation-delay: 580ms; }
    .cursor         {  }
    .failure-stamp  { transform-origin: center;  }
    @keyframes plate-fade { to { opacity: 1; } }
    @keyframes plate-blink { 50% { opacity: 0; } }
    @keyframes plate-stamp { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .failure-stamp { animation: none !important; opacity: 1 !important; }
      .cursor { animation: none !important; }
    }
  </style><filter id="ink-plate-02" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="0.45"></feDisplacementMap></filter><pattern id="grid-plate-02" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 16 0 L 0 0 0 16" stroke="#40434D" stroke-opacity="0.22" stroke-width="0.5" fill="none"></path></pattern></defs><rect width="1600" height="1000" class="plate-paper"></rect><rect x="48" y="48" width="1504" height="904" fill="url(#grid-plate-02)"></rect><g class="title-block"><line x1="48" y1="108" x2="1552" y2="108" class="plate-stroke w1"></line><text x="48" y="74" class="t-plate-number">PLATE 02</text><text x="48" y="96" class="t-plate-name">Foundation</text><text x="1552" y="74" text-anchor="end" class="t-plate-title">One useful host</text><g><rect x="1384" y="82" width="168" height="22" fill="none" class="plate-stroke-soft w1"></rect><text x="1468" y="98" text-anchor="middle" class="t-revision">REV 2026-07</text></g></g><g filter="url(#ink-plate-02)" class="plate-body"><g><line x1="520" y1="210" x2="520" y2="690" class="plate-stroke-hairline w1" stroke-dasharray="6 8"></line><text x="508" y="204" text-anchor="end" class="t-mono-small">FAILURE DOMAIN A</text><text x="532" y="204" class="t-mono-small">FAILURE DOMAIN B</text></g><g><circle cx="290" cy="230" r="16" class="plate-stroke w15" fill="none"></circle><path d="M 266 282 C 270 254 310 254 314 282" class="plate-stroke w15"></path><text x="330" y="252" class="t-label-soft">TENANT</text><text x="330" y="268" class="t-mono-small">THE PERSON THE SERVICE IS FOR</text></g><g><line x1="150" y1="630" x2="430" y2="630" class="plate-stroke w25"></line><rect x="180" y="300" width="220" height="330" class="plate-stroke w25 plate-fill-elevated"></rect><g><circle cx="224" cy="344" r="26" class="plate-stroke-hairline w1"></circle><circle cx="224" cy="344" r="17" class="plate-stroke-hairline w05"></circle><circle cx="224" cy="344" r="4" class="plate-stroke w1 plate-fill-tint"></circle><line x1="228.2426406871193" y1="348.24264068711926" x2="240.97056274847714" y2="360.97056274847716" class="plate-stroke-hairline w05"></line><line x1="219.7573593128807" y1="348.24264068711926" x2="207.02943725152286" y2="360.97056274847716" class="plate-stroke-hairline w05"></line><line x1="219.7573593128807" y1="339.75735931288074" x2="207.02943725152286" y2="327.02943725152284" class="plate-stroke-hairline w05"></line><line x1="228.2426406871193" y1="339.75735931288074" x2="240.97056274847714" y2="327.02943725152284" class="plate-stroke-hairline w05"></line></g><line x1="200" y1="432" x2="380" y2="432" class="plate-stroke-hairline w05"></line><rect x="204" y="452" width="172" height="110" class="plate-stroke-hairline w1 plate-fill-tint"></rect><line x1="216" y1="474" x2="364" y2="474" class="plate-stroke-hairline w05"></line><line x1="216" y1="494" x2="340" y2="494" class="plate-stroke-hairline w05"></line><line x1="216" y1="514" x2="320" y2="514" class="plate-stroke-hairline w05"></line><line x1="216" y1="534" x2="350" y2="534" class="plate-stroke-hairline w05"></line><text x="376" y="448" text-anchor="end" class="t-mono-small">ONE FLAGSHIP SERVICE</text><circle cx="378" cy="322" r="5" fill="#7AC0A0"></circle><g><rect x="200" y="592" width="44" height="16" class="plate-stroke-hairline w1 plate-fill-tint"></rect><rect x="256" y="592" width="30" height="16" class="plate-stroke-hairline w1 plate-fill-tint"></rect><circle cx="372" cy="600" r="6" class="plate-stroke-hairline w1 plate-fill-tint"></circle></g><text x="290" y="654" text-anchor="middle" class="t-label">SVC HOST</text><text x="290" y="672" text-anchor="middle" class="t-mono-small">ONE OWNER, ONE PATCH CADENCE</text></g><g><path d="M 400 440 C 460 440, 560 360, 620 360" class="plate-stroke w15" fill="none" stroke-dasharray="6 8"></path><polygon points="618,356 630,360 618,364" class="plate-ink"></polygon></g><g><line x1="590" y1="630" x2="830" y2="630" class="plate-stroke w25"></line><rect x="620" y="300" width="180" height="330" class="plate-stroke w25 plate-fill-elevated"></rect><g><rect x="640" y="340" width="140" height="54" class="plate-stroke-hairline w1 plate-fill-tint"></rect><text x="652" y="368" class="t-mono-small">DISK 1</text><circle cx="766" cy="360" r="5" fill="#7AC0A0"></circle></g><g><rect x="640" y="416" width="140" height="54" class="plate-stroke-hairline w1 plate-fill-tint"></rect><text x="652" y="444" class="t-mono-small">DISK 2</text><circle cx="766" cy="436" r="5" fill="#7AC0A0"></circle></g><rect x="640" y="510" width="140" height="110" class="plate-stroke-hairline w1 plate-fill-tint"></rect><text x="710" y="536" text-anchor="middle" class="t-label-soft">MIRRORED POOL</text><text x="710" y="558" text-anchor="middle" class="t-mono-small">SCRUB SCHEDULED</text><text x="710" y="580" text-anchor="middle" class="t-mono-small">POOL IS AVAILABILITY</text><text x="710" y="600" text-anchor="middle" class="t-mono-small">NOT A BACKUP</text><text x="710" y="654" text-anchor="middle" class="t-label">NAS</text><text x="710" y="672" text-anchor="middle" class="t-mono-small">SEPARATE POWER, SEPARATE OWNER</text></g><g><circle cx="396" cy="296" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="396" y="300" text-anchor="middle" class="t-anchor">1</text></g><g><circle cx="176" cy="296" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="176" y="300" text-anchor="middle" class="t-anchor">2</text></g><g><circle cx="176" cy="642" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="176" y="646" text-anchor="middle" class="t-anchor">3</text></g><g><circle cx="510" cy="410" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="510" y="414" text-anchor="middle" class="t-anchor">4</text></g><g><circle cx="804" cy="642" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="804" y="646" text-anchor="middle" class="t-anchor">5</text></g><g><line x1="888" y1="220" x2="888" y2="700" class="plate-stroke-hairline w05"></line><text x="900" y="208" class="t-label-soft">FIELD ANNOTATIONS</text><g class="fade-in d-1"><circle cx="912" cy="236" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="912" y="240" text-anchor="middle" class="t-anchor">1</text><text x="934" y="232" class="t-label">HEALTH INDICATOR</text><text x="934" y="254" class="t-callout">Green is reachable, not healthy.</text><line x1="888" y1="304" x2="1536" y2="304" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-2"><circle cx="912" cy="332" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="912" y="336" text-anchor="middle" class="t-anchor">2</text><text x="934" y="328" class="t-label">FAN AND POWER</text><text x="934" y="350" class="t-callout">This runs every hour. Idle draw is a choice.</text><line x1="888" y1="400" x2="1536" y2="400" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-3"><circle cx="912" cy="428" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="912" y="432" text-anchor="middle" class="t-anchor">3</text><text x="934" y="424" class="t-label">ONE OWNER, ONE SHELF</text><text x="934" y="446" class="t-callout">One documented recovery procedure.</text><line x1="888" y1="496" x2="1536" y2="496" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-4"><circle cx="912" cy="524" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="912" y="528" text-anchor="middle" class="t-anchor">4</text><text x="934" y="520" class="t-label">ACROSS THE BOUNDARY</text><text x="934" y="542" class="t-callout">Different circuit, different building.</text><line x1="888" y1="592" x2="1536" y2="592" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-5"><circle cx="912" cy="620" r="11" class="plate-stroke w15 plate-fill-elevated"></circle><text x="912" y="624" text-anchor="middle" class="t-anchor">5</text><text x="934" y="616" class="t-label">A POOL, NOT A BACKUP</text><text x="934" y="638" class="t-callout">A mirror is availability. The backup lives elsewhere.</text><line x1="888" y1="688" x2="1536" y2="688" class="plate-stroke-hairline w05"></line></g></g><g><rect x="48" y="736" width="1504" height="216" class="plate-stroke w15 plate-fill-elevated"></rect><line x1="48" y1="778" x2="1552" y2="778" class="plate-stroke-hairline w05"></line><text x="68" y="764" class="t-label">RESTORE RECORD</text><text x="248" y="764" class="t-body-soft">A restore record is proof. A backup job status is not.</text><text x="1532" y="764" text-anchor="end" class="t-stamp plate-warn" fill="#E6704F">EXAMPLE RECORD, SYNTHETIC</text><g><text x="68" y="808" class="t-label-soft">DATE</text><text x="68" y="838" class="t-mono">YYYY-MM-DD</text><line x1="62" y1="854" x2="340.8" y2="854" class="plate-stroke-hairline w05"></line><text x="68" y="876" class="t-body-soft">A date the person can find,</text><text x="68" y="894" class="t-body-soft">not just a job id.</text></g><g><text x="360.8" y="808" class="t-label-soft">SOURCE</text><text x="360.8" y="838" class="t-mono">SVC HOST</text><line x1="354.8" y1="854" x2="633.6" y2="854" class="plate-stroke-hairline w05"></line><text x="360.8" y="876" class="t-body-soft">What was restored, by role.</text></g><g><text x="653.6" y="808" class="t-label-soft">RESTORED ON</text><text x="653.6" y="838" class="t-mono">CANARY HOST</text><line x1="647.6" y1="854" x2="926.4000000000001" y2="854" class="plate-stroke-hairline w05"></line><text x="653.6" y="876" class="t-body-soft">Somewhere other than the</text><text x="653.6" y="894" class="t-body-soft">source.</text></g><g><text x="946.4000000000001" y="808" class="t-label-soft">CHECKSUM</text><text x="946.4000000000001" y="838" class="t-mono">sha256: match</text><line x1="940.4000000000001" y1="854" x2="1219.2" y2="854" class="plate-stroke-hairline w05"></line><text x="946.4000000000001" y="876" class="t-body-soft">A verified match, not a job</text><text x="946.4000000000001" y="894" class="t-body-soft">status.</text></g><g><text x="1239.2" y="808" class="t-label-soft">ELAPSED</text><text x="1239.2" y="838" class="t-mono">HH:MM:SS</text><line x1="1233.2" y1="854" x2="1512" y2="854" class="plate-stroke-hairline w05"></line><text x="1239.2" y="876" class="t-body-soft">Real elapsed time on the</text><text x="1239.2" y="894" class="t-body-soft">day.</text></g></g></g></svg>
