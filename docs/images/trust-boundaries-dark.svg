<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 920" width="1200" height="920">
<title id="title">Homelab network trust boundaries</title>
<desc id="desc">A network model separating public ingress, private administration, household clients, untrusted devices, services, and management systems.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="920" fill="#0d1117"/>
<text x="52" y="54" class="eyebrow" fill="#58a6ff">NETWORK AND ACCESS</text>
<text x="52" y="98" class="heading" fill="#e6edf3">Permit named dependencies, not entire networks</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#30363d"/>
<rect x="50" y="160" width="1100" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M 51 246 V 174 Q 51 161 64 161 H 1136 Q 1149 161 1149 174 V 246 Z" fill="#161b22"/>
<line x1="50" y1="246" x2="1150" y2="246" stroke="#30363d"/>
<circle cx="84" cy="192" r="7" fill="#3fb950"/>
<text x="106" y="200" class="group-title" fill="#e6edf3">Access edge</text>
<text x="106" y="228" class="small" fill="#9198a1">Public traffic terminates here. Administration enters through a private path.</text>
<rect x="50" y="485" width="1100" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" stroke-dasharray="10 8"/>
<path d="M 51 571 V 499 Q 51 486 64 486 H 1136 Q 1149 486 1149 499 V 571 Z" fill="#161b22"/>
<line x1="50" y1="571" x2="1150" y2="571" stroke="#30363d"/>
<circle cx="84" cy="517" r="7" fill="#58a6ff"/>
<text x="106" y="525" class="group-title" fill="#e6edf3">Internal trust zones</text>
<text x="106" y="553" class="small" fill="#9198a1">Segment by authority and consequence, then allow only documented flows.</text>
<line x1="415" y1="275" x2="415" y2="400" stroke="#30363d" stroke-width="1"/>
<line x1="785" y1="275" x2="785" y2="400" stroke="#30363d" stroke-width="1"/>
<line x1="415" y1="600" x2="415" y2="725" stroke="#30363d" stroke-width="1"/>
<line x1="785" y1="600" x2="785" y2="725" stroke="#30363d" stroke-width="1"/>
<g id="internet">
<circle cx="95" cy="300" r="5" fill="#58a6ff"/>
<text x="112" y="307" class="title" fill="#e6edf3">Internet</text>
<text x="112" y="347" class="body" fill="#9198a1">Untrusted by default</text>
<text x="112" y="377" class="body" fill="#9198a1">HTTPS and VPN only</text>
</g>
<g id="edge">
<circle cx="460" cy="300" r="5" fill="#3fb950"/>
<text x="477" y="307" class="title" fill="#e6edf3">Ingress + VPN edge</text>
<text x="477" y="347" class="body" fill="#9198a1">TLS termination + routing</text>
<text x="477" y="377" class="body" fill="#9198a1">No application authority</text>
</g>
<g id="services">
<circle cx="830" cy="300" r="5" fill="#3fb950"/>
<text x="847" y="307" class="title" fill="#e6edf3">Published services</text>
<text x="847" y="347" class="body" fill="#9198a1">Explicit routes only</text>
<text x="847" y="377" class="body" fill="#9198a1">No management plane</text>
</g>
<g id="clients">
<circle cx="95" cy="625" r="5" fill="#58a6ff"/>
<text x="112" y="632" class="title" fill="#e6edf3">Trusted clients</text>
<text x="112" y="672" class="body" fill="#9198a1">Household devices</text>
<text x="112" y="702" class="body" fill="#9198a1">Named service access</text>
</g>
<g id="iot">
<circle cx="460" cy="625" r="5" fill="#d29922"/>
<text x="477" y="632" class="title" fill="#e6edf3">IoT + guests</text>
<text x="477" y="672" class="body" fill="#9198a1">Internet + narrow local flows</text>
<text x="477" y="702" class="body" fill="#9198a1">No administrative access</text>
</g>
<g id="management">
<circle cx="830" cy="625" r="5" fill="#f778ba"/>
<text x="847" y="632" class="title" fill="#e6edf3">Management zone</text>
<text x="847" y="672" class="body" fill="#9198a1">Hypervisor · storage · network</text>
<text x="847" y="702" class="body" fill="#9198a1">VPN or admin identity only</text>
</g>
<text x="600.0" y="896" text-anchor="middle" class="body" fill="#9198a1">Default policy: deny new cross-zone flows · allow named dependencies · log consequential denies.</text>
</svg>
