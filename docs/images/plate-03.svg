<?xml version="1.0" encoding="UTF-8"?>
<svg class="plate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-plate-03 desc-plate-03" data-plate="plate-03" data-theme="light" data-failure="none" preserveAspectRatio="xMidYMid meet"><title id="title-plate-03">Plate 03, Trust boundaries</title><desc id="desc-plate-03">Trust boundaries are physical, not conceptual. A boundary is a wall with named doors. Deny cross-zone by default. Allow only documented flows. A top-down plan of three rooms. Edge on the left has a thin wall and contains a TLS terminator and a remote-access mesh. Private core in the middle has a thick wall and contains compute, identity, and network. Data on the right has a thick wall with a lock on its door and contains a storage pool. An optional AI annex with a dashed wall sits beside the core. Door labels name the allowed flow at each opening. A bottom stripe states the default policy: deny cross-zone, allow named dependencies, log denies with consequence.</desc><defs><style>
    .plate-paper { fill: #F1EBDD; }
    .plate-paper-tint { fill: #E6DECA; }
    .plate-paper-elevated { fill: #F7F1E1; }
    .plate-ink { fill: #181613; }
    .plate-ink-soft { fill: #7A7261; }
    .plate-warn { fill: #A83521; }
    .plate-verify { fill: #2B5D4A; }
    .plate-stroke { stroke: #181613; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-soft { stroke: #7A7261; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-hairline { stroke: #BFB49B; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-warn { stroke: #A83521; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-verify { stroke: #2B5D4A; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-fill-paper { fill: #F1EBDD; }
    .plate-fill-tint { fill: #E6DECA; }
    .plate-fill-elevated { fill: #F7F1E1; }
    .w05 { stroke-width: 0.6; }
    .w1  { stroke-width: 1.1; }
    .w15 { stroke-width: 1.6; }
    .w25 { stroke-width: 2.4; }
    .w4  { stroke-width: 3.6; }
    .t-plate-number { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; fill: #181613; }
    .t-plate-name   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #7A7261; }
    .t-plate-title  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; fill: #181613; }
    .t-teaching     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 19px; fill: #181613; }
    .t-revision     { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; letter-spacing: 0.08em; fill: #7A7261; }
    .t-callout      { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 15px; fill: #181613; }
    .t-label        { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #181613; }
    .t-label-soft   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #7A7261; }
    .t-body         { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #181613; }
    .t-body-soft    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #7A7261; }
    .t-mono         { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #181613; }
    .t-mono-soft    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #7A7261; }
    .t-mono-small   { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 10px; fill: #7A7261; letter-spacing: 0.06em; }
    .t-stamp        { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .t-question     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 28px; fill: #181613; }
    .t-question-hint{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 12px; letter-spacing: 0.02em; fill: #7A7261; }
    .t-destination  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 15px; font-weight: 700; letter-spacing: 0.06em; fill: #181613; }
    .t-consequence  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 13px; fill: #7A7261; }
    .t-footer       { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 17px; fill: #181613; }
    .t-anchor       { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; fill: #181613; letter-spacing: 0.02em; }
    .fade-in        { opacity: 1;  }
    .fade-in.d-1    { animation-delay: 260ms; }
    .fade-in.d-2    { animation-delay: 340ms; }
    .fade-in.d-3    { animation-delay: 420ms; }
    .fade-in.d-4    { animation-delay: 500ms; }
    .fade-in.d-5    { animation-delay: 580ms; }
    .cursor         {  }
    .failure-stamp  { transform-origin: center;  }
    @keyframes plate-fade { to { opacity: 1; } }
    @keyframes plate-blink { 50% { opacity: 0; } }
    @keyframes plate-stamp { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .failure-stamp { animation: none !important; opacity: 1 !important; }
      .cursor { animation: none !important; }
    }
  </style><filter id="ink-plate-03" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="0.45"></feDisplacementMap></filter><pattern id="grid-plate-03" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 16 0 L 0 0 0 16" stroke="#BFB49B" stroke-opacity="0.22" stroke-width="0.5" fill="none"></path></pattern></defs><rect width="1600" height="1000" class="plate-paper"></rect><rect x="48" y="48" width="1504" height="904" fill="url(#grid-plate-03)"></rect><g class="title-block"><line x1="48" y1="108" x2="1552" y2="108" class="plate-stroke w1"></line><text x="48" y="74" class="t-plate-number">PLATE 03</text><text x="48" y="96" class="t-plate-name">Boundaries</text><text x="1552" y="74" text-anchor="end" class="t-plate-title">Trust boundaries</text><g><rect x="1384" y="82" width="168" height="22" fill="none" class="plate-stroke-soft w1"></rect><text x="1468" y="98" text-anchor="middle" class="t-revision">REV 2026-07</text></g></g><g filter="url(#ink-plate-03)" class="plate-body"><g><text x="220" y="140" text-anchor="middle" class="t-label-soft">UNTRUSTED, EPHEMERAL</text><text x="640" y="140" text-anchor="middle" class="t-label-soft">TRUSTED, MAINTAINED</text><text x="1110" y="140" text-anchor="middle" class="t-label-soft">IRREPLACEABLE, RECOVERABLE</text><text x="1445" y="140" text-anchor="middle" class="t-label-soft">OPTIONAL ANNEX</text></g><g><text x="220" y="236" text-anchor="middle" class="t-label">PUBLIC INTERNET</text><path d="M 100 248 L 340 248" class="plate-stroke-hairline w05" stroke-dasharray="4 6"></path></g><g><rect x="100" y="280" width="240" height="400" class="plate-fill-tint"></rect><path d="M 100 280 L 190 280 M 250 280 L 340 280 M 340 280 L 340 450 M 340 510 L 340 680 M 100 680 L 340 680 M 100 280 L 100 680" class="plate-stroke w25"></path><text x="116" y="306" class="t-label">EDGE</text><text x="324" y="306" text-anchor="end" class="t-mono-small">THIN WALL</text><rect x="120" y="340" width="200" height="90" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="220" y="370" text-anchor="middle" class="t-label">TLS TERMINATOR</text><text x="220" y="390" text-anchor="middle" class="t-body-soft">publishes,</text><text x="220" y="408" text-anchor="middle" class="t-body-soft">never authorizes</text><rect x="120" y="540" width="200" height="90" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="220" y="570" text-anchor="middle" class="t-label">REMOTE ACCESS MESH</text><text x="220" y="590" text-anchor="middle" class="t-body-soft">no admin ports</text><text x="220" y="608" text-anchor="middle" class="t-body-soft">exposed to the internet</text></g><g><rect x="400" y="220" width="480" height="460" class="plate-fill-paper"></rect><path d="M 400 220 L 880 220 M 880 220 L 880 240 M 880 280 L 880 450 M 880 510 L 880 680 M 400 680 L 880 680 M 400 220 L 400 450 M 400 510 L 400 680" class="plate-stroke w4"></path><text x="420" y="250" class="t-label">PRIVATE CORE</text><text x="860" y="250" text-anchor="end" class="t-mono-small">THICK WALL</text><rect x="440" y="290" width="180" height="110" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="530" y="318" text-anchor="middle" class="t-label">COMPUTE</text><text x="530" y="342" text-anchor="middle" class="t-body-soft">containers or VMs</text><text x="530" y="362" text-anchor="middle" class="t-body-soft">one owner per service</text><text x="530" y="382" text-anchor="middle" class="t-body-soft">patched on a schedule</text><rect x="660" y="290" width="180" height="110" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="750" y="318" text-anchor="middle" class="t-label">IDENTITY</text><text x="750" y="342" text-anchor="middle" class="t-body-soft">OIDC authority</text><text x="750" y="362" text-anchor="middle" class="t-body-soft">break-glass sealed</text><text x="750" y="382" text-anchor="middle" class="t-body-soft">recovery is independent</text><rect x="440" y="430" width="400" height="100" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="640" y="456" text-anchor="middle" class="t-label">NETWORK</text><text x="640" y="478" text-anchor="middle" class="t-body-soft">resolver, ingress routing, policy</text><text x="640" y="498" text-anchor="middle" class="t-body-soft">two resolvers on independent domains</text><rect x="440" y="560" width="400" height="90" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="640" y="586" text-anchor="middle" class="t-label">OBSERVABILITY</text><text x="640" y="608" text-anchor="middle" class="t-body-soft">reachability, host health, job heartbeats</text><text x="640" y="628" text-anchor="middle" class="t-body-soft">the alert path lives outside this zone</text></g><g><rect x="940" y="280" width="340" height="400" class="plate-fill-paper"></rect><path d="M 940 280 L 1280 280 M 1280 280 L 1280 680 M 940 680 L 1280 680 M 940 280 L 940 450 M 940 510 L 940 680" class="plate-stroke w4"></path><text x="960" y="310" class="t-label">DATA</text><text x="1260" y="310" text-anchor="end" class="t-mono-small">THICK WALL, LOCKED</text><text x="1110" y="362" text-anchor="middle" class="t-label">STORAGE POOL</text><text x="1110" y="382" text-anchor="middle" class="t-body-soft">integrity, snapshots, recovery source</text><rect x="980" y="410" width="260" height="34" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><rect x="980" y="454" width="260" height="34" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><rect x="980" y="498" width="260" height="34" class="plate-stroke-hairline w15 plate-fill-elevated"></rect><text x="1000" y="432" class="t-mono-small">DISK 1</text><text x="1000" y="476" class="t-mono-small">DISK 2</text><text x="1000" y="520" class="t-mono-small">DISK 3</text><text x="1110" y="570" text-anchor="middle" class="t-body-soft">The encrypted copy lives elsewhere.</text><text x="1110" y="588" text-anchor="middle" class="t-body-soft">See Plate 04 for the recovery chain.</text></g><g><rect x="1340" y="340" width="210" height="180" class="plate-fill-tint"></rect><rect x="1340" y="340" width="210" height="180" class="plate-stroke w15" stroke-dasharray="8 6" fill="none"></rect><text x="1445" y="370" text-anchor="middle" class="t-label">AI ANNEX</text><text x="1445" y="390" text-anchor="middle" class="t-mono-small">OPTIONAL</text><line x1="1360" y1="406" x2="1530" y2="406" class="plate-stroke-hairline w05"></line><text x="1445" y="436" text-anchor="middle" class="t-body-soft">Unplug without</text><text x="1445" y="454" text-anchor="middle" class="t-body-soft">losing household services</text><text x="1445" y="478" text-anchor="middle" class="t-body-soft">Separate power domain</text><text x="1445" y="496" text-anchor="middle" class="t-body-soft">from Core</text></g><g><path d="M 880 260 L 910 260 L 910 200 L 1445 200 L 1445 340" class="plate-stroke-hairline w15" stroke-dasharray="6 6" fill="none"></path></g><g><path d="M 196 280 A 24 24 0 0 1 244 280" class="plate-stroke-hairline w05" fill="none"></path><path d="M 340 456 A 24 24 0 0 1 340 504" class="plate-stroke-hairline w05" fill="none"></path><path d="M 940 456 A 24 24 0 0 1 940 504" class="plate-stroke-hairline w05" fill="none"></path></g><g><g><rect x="120" y="249" width="200" height="50" rx="2" class="plate-stroke-hairline w1 plate-fill-elevated"></rect><text x="220" y="270" text-anchor="middle" class="t-mono-small">443/tcp, HTTPS only</text><text x="220" y="285" text-anchor="middle" class="t-mono-small">TLS SNI required</text></g><g><rect x="265" y="455" width="210" height="50" rx="2" class="plate-stroke-hairline w1 plate-fill-elevated"></rect><text x="370" y="476" text-anchor="middle" class="t-mono-small">documented ports</text><text x="370" y="491" text-anchor="middle" class="t-mono-small">stateful return only</text></g><g><rect x="800" y="455" width="220" height="50" rx="2" class="plate-stroke-hairline w1 plate-fill-elevated"></rect><text x="910" y="476" text-anchor="middle" class="t-mono-small">documented CIDR</text><text x="910" y="491" text-anchor="middle" class="t-mono-small">service accounts only</text></g><g><rect x="1067.5" y="182.5" width="220" height="35" rx="2" class="plate-stroke-hairline w1 plate-fill-elevated"></rect><text x="1177.5" y="203.5" text-anchor="middle" class="t-mono-small">unix socket, read-only</text></g></g><g transform="translate(910 542)"><rect x="-12" y="-6" width="24" height="20" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M -7 -6 L -7 -12 A 7 7 0 0 1 7 -12 L 7 -6" class="plate-stroke w15" fill="none"></path></g><g><rect x="48" y="840" width="1504" height="112" class="plate-stroke w15 plate-fill-elevated"></rect><text x="68" y="868" class="t-label">DEFAULT POLICY</text><text x="68" y="898" class="t-callout">Deny cross-zone. Allow named dependencies. Log denies with consequence.</text><text x="68" y="922" class="t-body-soft">Keep the management plane inside Private Core and reachable only from the mesh above.</text><text x="1532" y="868" text-anchor="end" class="t-mono-small">FLOW LABELS SIT ON PAPER CHIPS</text><text x="1532" y="898" text-anchor="end" class="t-mono-small">THE LOCK MARKS AN IDENTITY BOUNDARY</text><text x="1532" y="922" text-anchor="end" class="t-mono-small">THE DASHED WALL IS OPTIONAL</text></g></g></svg>
