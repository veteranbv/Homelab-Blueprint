    .plate-paper-tint { fill: #0D1410; }
    .plate-paper-elevated { fill: #131C17; }
    .plate-ink { fill: #E6EFE8; }
    .plate-ink-soft { fill: #8BA695; }
    .plate-warn { fill: #F87171; }
    .plate-verify { fill: #2CEB8D; }
    .plate-stroke { stroke: #E6EFE8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-soft { stroke: #8BA695; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-hairline { stroke: #22302A; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-warn { stroke: #F87171; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-verify { stroke: #2CEB8D; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-fill-paper { fill: #070B09; }
    .plate-fill-tint { fill: #0D1410; }
    .plate-fill-elevated { fill: #131C17; }
