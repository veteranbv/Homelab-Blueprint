<?xml version="1.0" encoding="UTF-8"?>
<svg class="plate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-plate-01 desc-plate-01" data-plate="plate-01" data-theme="dark" data-failure="none" preserveAspectRatio="xMidYMid meet"><title id="title-plate-01">Plate 01, The question sheet</title><desc id="desc-plate-01">A homelab follows from three answers. Everything downstream is a consequence of them. A drafting sheet titled The question sheet. It shows three pencilled questions on a card: who is this actually for, what data cannot be recreated, and what must keep working when you are away. To the right, a layer stack lists four destinations. Each destination has a tick box and the condition that adds it: learn, create value, add resilience, add bounded automation. A footer reminds the reader to stop at the destination that solves the problem.</desc><defs><style>
