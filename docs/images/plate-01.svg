    .w1  { stroke-width: 1.1; }
    .w15 { stroke-width: 1.6; }
    .w25 { stroke-width: 2.4; }
    .w4  { stroke-width: 3.6; }
    .t-plate-number { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 42px; font-weight: 650; letter-spacing: -0.04em; fill: #E6EFE8; }
    .t-plate-name   { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; fill: #8BA695; }
    .t-plate-title  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; fill: #E6EFE8; }
    .t-teaching     { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 19px; fill: #E6EFE8; }
    .t-revision     { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; letter-spacing: 0.08em; fill: #8BA695; }
    .t-callout      { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #E6EFE8; }
    .t-label        { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; fill: #E6EFE8; }
    .t-label-soft   { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; fill: #8BA695; }
    .t-body         { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #E6EFE8; }
    .t-body-soft    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #8BA695; }
    .t-mono         { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #E6EFE8; }
    .t-mono-soft    { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #8BA695; }
    .t-mono-small   { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 10px; fill: #8BA695; letter-spacing: 0.06em; }
    .t-stamp        { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .t-question     { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 25px; font-weight: 600; fill: #E6EFE8; }
    .t-question-hint{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 12px; letter-spacing: 0.02em; fill: #8BA695; }
    .t-destination  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 15px; font-weight: 700; letter-spacing: 0.06em; fill: #E6EFE8; }
    .t-consequence  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; fill: #8BA695; }
    .t-footer       { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 17px; fill: #E6EFE8; }
    .t-anchor       { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; fill: #E6EFE8; letter-spacing: 0.02em; }
    .fade-in        { opacity: 1;  }
    .fade-in.d-1    { animation-delay: 260ms; }
    .fade-in.d-2    { animation-delay: 340ms; }
    .fade-in.d-3    { animation-delay: 420ms; }
    .fade-in.d-4    { animation-delay: 500ms; }
    .fade-in.d-5    { animation-delay: 580ms; }
    .cursor         {  }
    .failure-stamp  { transform-origin: center;  }
    @keyframes plate-fade { to { opacity: 1; } }
    @keyframes plate-blink { 50% { opacity: 0; } }
    @keyframes plate-stamp { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .failure-stamp { animation: none !important; opacity: 1 !important; }
      .cursor { animation: none !important; }
    }
  </style><filter id="ink-plate-01" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="0.45"></feDisplacementMap></filter><pattern id="grid-plate-01" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 16 0 L 0 0 0 16" stroke="#22302A" stroke-opacity="0.22" stroke-width="0.5" fill="none"></path></pattern></defs><rect width="1600" height="1000" class="plate-paper"></rect><rect x="48" y="48" width="1504" height="904" fill="url(#grid-plate-01)"></rect><g class="title-block"><line x1="48" y1="108" x2="1552" y2="108" class="plate-stroke w1"></line><text x="48" y="74" class="t-plate-number">PLATE 01</text><text x="48" y="96" class="t-plate-name">Start with the outcome</text><text x="1552" y="74" text-anchor="end" class="t-plate-title">The question sheet</text><g><rect x="1384" y="82" width="168" height="22" fill="none" class="plate-stroke-soft w1"></rect><text x="1468" y="98" text-anchor="middle" class="t-revision">REV 2026-07</text></g></g><g filter="url(#ink-plate-01)" class="plate-body"><g transform="translate(456 496) rotate(-1.2) translate(-456 -496)"><rect x="96" y="168" width="720" height="656" rx="4" class="plate-fill-tint plate-stroke w15"></rect><line x1="136" y1="212" x2="776" y2="212" class="plate-stroke-hairline w05"></line><text x="136" y="202" class="t-label-soft">THREE QUESTIONS, IN ORDER</text><g class="fade-in" style="animation-delay:260ms"><text x="136" y="268" class="t-mono-small">01</text><text x="192" y="268" class="t-question">Who is this actually for?</text><line x1="192" y1="282" x2="502" y2="282" class="plate-stroke-soft w1" style="animation-delay:400ms"></line><text x="192" y="312" class="t-question-hint">Name a person, not a persona.</text><text x="192" y="350" class="t-consequence">The service level is set by who notices when it breaks.</text></g><g class="fade-in" style="animation-delay:400ms"><text x="136" y="448" class="t-mono-small">02</text><text x="192" y="448" class="t-question">What data cannot be recreated?</text><line x1="192" y1="462" x2="564" y2="462" class="plate-stroke-soft w1" style="animation-delay:540ms"></line><text x="192" y="492" class="t-question-hint">Name the folder or the record.</text><text x="192" y="530" class="t-consequence">Recovery, not storage, is where that data survives.</text></g><g class="fade-in" style="animation-delay:540ms"><text x="136" y="628" class="t-mono-small">03</text><text x="192" y="628" class="t-question">What must keep working when you are away?</text><line x1="192" y1="642" x2="700.4000000000001" y2="642" class="plate-stroke-soft w1" style="animation-delay:680ms"></line><text x="192" y="672" class="t-question-hint">Name the hour, not the aspiration.</text><text x="192" y="710" class="t-consequence">That list is the local-first side of the design.</text></g></g><g><text x="896" y="160" class="t-label-soft">FOUR DESTINATIONS, IN ORDER</text><text x="1512" y="160" text-anchor="end" class="t-mono-small">STOP AT THE ONE THAT SOLVES YOUR PROBLEM</text><g class="fade-in" style="animation-delay:320ms"><line x1="896" y1="168" x2="1512" y2="168" class="plate-stroke w1" style="animation-delay:200ms"></line><rect x="904" y="202" width="26" height="26" rx="2" class="plate-stroke w15 plate-fill-paper"></rect><text x="958" y="222" class="t-destination">LEARN</text><text x="958" y="260" class="t-body-soft">When you can name the first workload and its owner.</text><text x="1504" y="222" text-anchor="end" class="t-mono-small">01</text></g><g class="fade-in" style="animation-delay:420ms"><line x1="896" y1="316" x2="1512" y2="316" class="plate-stroke w1" style="animation-delay:300ms"></line><rect x="904" y="350" width="26" height="26" rx="2" class="plate-stroke w15 plate-fill-paper"></rect><text x="958" y="370" class="t-destination">CREATE VALUE</text><text x="958" y="408" class="t-body-soft">When someone else depends on the service you keep.</text><text x="1504" y="370" text-anchor="end" class="t-mono-small">02</text></g><g class="fade-in" style="animation-delay:520ms"><line x1="896" y1="464" x2="1512" y2="464" class="plate-stroke w1" style="animation-delay:400ms"></line><rect x="904" y="498" width="26" height="26" rx="2" class="plate-stroke w15 plate-fill-paper"></rect><text x="958" y="518" class="t-destination">ADD RESILIENCE</text><text x="958" y="556" class="t-body-soft">When downtime has a cost you can name.</text><text x="1504" y="518" text-anchor="end" class="t-mono-small">03</text></g><g class="fade-in" style="animation-delay:620ms"><line x1="896" y1="612" x2="1512" y2="612" class="plate-stroke w1" style="animation-delay:500ms"></line><rect x="904" y="646" width="26" height="26" rx="2" class="plate-stroke w15 plate-fill-paper"></rect><text x="958" y="666" class="t-destination">ADD BOUNDED AUTOMATION</text><text x="958" y="704" class="t-body-soft">When the operating loop is provable and the change surface is narrow.</text><text x="1504" y="666" text-anchor="end" class="t-mono-small">04</text></g><line x1="896" y1="760" x2="1512" y2="760" class="plate-stroke w1" style="animation-delay:640ms"></line></g><g class="fade-in" style="animation-delay:700ms"><line x1="48" y1="892" x2="1552" y2="892" class="plate-stroke-hairline w05"></line><text x="800" y="932" text-anchor="middle" class="t-footer">Complexity is not progress by itself. Complexity is a cost you pay for a capability.</text></g></g></svg>
