<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 780" width="1200" height="780">
<title id="title">Backup and recovery flow</title>
<desc id="desc">A recovery chain from application-consistent exports through encrypted backup and an independent copy to restore proof and disaster recovery.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="780" fill="#0d1117"/>
<text x="52" y="54" class="eyebrow" fill="#58a6ff">DATA PROTECTION</text>
<text x="52" y="98" class="heading" fill="#e6edf3">A backup is a chain of recoverable evidence</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#30363d"/>
<rect x="50" y="160" width="1100" height="390" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M 51 246 V 174 Q 51 161 64 161 H 1136 Q 1149 161 1149 174 V 246 Z" fill="#161b22"/>
<line x1="50" y1="246" x2="1150" y2="246" stroke="#30363d"/>
<circle cx="84" cy="192" r="7" fill="#3fb950"/>
<text x="106" y="200" class="group-title" fill="#e6edf3">The recoverable chain</text>
<text x="106" y="228" class="small" fill="#9198a1">Each stage has its own failure boundary, credentials, and proof.</text>
<rect x="1019" y="183" width="107" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="1072.5" y="205" text-anchor="middle" class="badge" fill="#3fb950">3-2-1-1-0</text>
<line x1="325" y1="275" x2="325" y2="505" stroke="#30363d" stroke-width="1"/>
<line x1="595" y1="275" x2="595" y2="505" stroke="#30363d" stroke-width="1"/>
<line x1="865" y1="275" x2="865" y2="505" stroke="#30363d" stroke-width="1"/>
<g id="app">
<circle cx="87" cy="300" r="5" fill="#58a6ff"/>
<text x="104" y="307" class="title" fill="#e6edf3">01 · Export</text>
<text x="104" y="347" class="body" fill="#9198a1">Application-consistent</text>
<text x="104" y="377" class="body" fill="#9198a1">Recovery metadata</text>
<text x="104" y="407" class="body" fill="#9198a1">Known-good ordering</text>
</g>
<g id="repo">
<circle cx="357" cy="300" r="5" fill="#3fb950"/>
<text x="374" y="307" class="title" fill="#e6edf3">02 · Back up</text>
<text x="374" y="347" class="body" fill="#9198a1">Encrypted repository</text>
<text x="374" y="377" class="body" fill="#9198a1">Versioned snapshots</text>
<text x="374" y="407" class="body" fill="#9198a1">Freshness heartbeat</text>
</g>
<g id="offsite">
<circle cx="627" cy="300" r="5" fill="#d29922"/>
<text x="644" y="307" class="title" fill="#e6edf3">03 · Isolate</text>
<text x="644" y="347" class="body" fill="#9198a1">Off-site or offline</text>
<text x="644" y="377" class="body" fill="#9198a1">Separate credentials</text>
<text x="644" y="407" class="body" fill="#9198a1">Deletion resistance</text>
</g>
<g id="restore">
<circle cx="897" cy="300" r="5" fill="#f778ba"/>
<text x="914" y="307" class="title" fill="#e6edf3">04 · Prove</text>
<text x="914" y="347" class="body" fill="#9198a1">Scheduled canary</text>
<text x="914" y="377" class="body" fill="#9198a1">Checksum + app test</text>
<text x="914" y="407" class="body" fill="#9198a1">Recorded outcome</text>
</g>
<g id="dr">
<rect x="210" y="600" width="780" height="100" rx="16" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
<rect x="210" y="600" width="6" height="100" rx="3" fill="#ff7b72"/>
<text x="238" y="642" class="title" fill="#e6edf3">Periodic disaster-recovery exercise</text>
<text x="238" y="676" class="body" fill="#9198a1">Rebuild without the source system · recover secrets · measure the real recovery time</text>
</g>
<text x="600.0" y="756" text-anchor="middle" class="body" fill="#9198a1">RAID, snapshots, replication, and sync each solve a problem. None alone is a backup strategy.</text>
</svg>
