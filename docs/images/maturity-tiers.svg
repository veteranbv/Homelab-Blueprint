<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820" width="1200" height="820">
<title id="title">Homelab maturity tiers</title>
<desc id="desc">A layered reference architecture progressing from one useful host through separated storage and compute, resilient operations, and an optional AI workload plane.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="52" y="54" class="eyebrow" fill="#0969da">REFERENCE ARCHITECTURE</text>
<text x="52" y="98" class="heading" fill="#1f2328">Add layers only when they earn their cost</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#d0d7de"/>
<g id="foundation">
<rect x="90" y="610" width="1020" height="120" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<rect x="90" y="610" width="6" height="120" rx="3" fill="#0969da"/>
<rect x="1006" y="630" width="82" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="1047.0" y="651" text-anchor="middle" class="badge" fill="#0969da">START</text>
<text x="118" y="652" class="title" fill="#1f2328">Foundation · one maintained host</text>
<text x="118" y="686" class="body" fill="#59636e">Linux · Compose · private access · security updates · independent backup · restore proof</text>
</g>
<g id="separate">
<rect x="150" y="445" width="900" height="120" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<rect x="150" y="445" width="6" height="120" rx="3" fill="#1a7f37"/>
<rect x="896" y="465" width="132" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="962.0" y="486" text-anchor="middle" class="badge" fill="#1a7f37">DATA MATTERS</text>
<text x="178" y="487" class="title" fill="#1f2328">Separated roles</text>
<text x="178" y="521" class="body" fill="#59636e">Compute · storage · DNS and ingress · monitoring · explicit failure boundaries</text>
</g>
<g id="operate">
<rect x="210" y="280" width="780" height="120" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<rect x="210" y="280" width="6" height="120" rx="3" fill="#9a6700"/>
<rect x="818" y="300" width="150" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="893.0" y="321" text-anchor="middle" class="badge" fill="#9a6700">DOWNTIME COSTS</text>
<text x="238" y="322" class="title" fill="#1f2328">Resilient operations</text>
<text x="238" y="356" class="body" fill="#59636e">Inventory · configuration as code · canary updates · off-site recovery · power plans</text>
</g>
<g id="ai">
<rect x="270" y="150" width="660" height="95" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<rect x="270" y="150" width="6" height="95" rx="3" fill="#bf3989"/>
<rect x="785" y="170" width="123" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="846.5" y="191" text-anchor="middle" class="badge" fill="#bf3989">WHEN USEFUL</text>
<text x="298" y="192" class="title" fill="#1f2328">Optional AI workload plane</text>
<text x="298" y="226" class="body" fill="#59636e">Separate inference · provider boundary · guarded tools</text>
</g>
<text x="600.0" y="796" text-anchor="middle" class="body" fill="#59636e">A smaller system with proven recovery is more mature than a larger system without it.</text>
</svg>
