<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 780" width="1200" height="780">
<title id="title">Homelab operations control loop</title>
<desc id="desc">A control loop from authoritative inventory through planning, approval, narrow execution, live verification, and recorded evidence.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="780" fill="#ffffff"/>
<text x="52" y="54" class="eyebrow" fill="#0969da">CONTROL PLANE</text>
<text x="52" y="98" class="heading" fill="#1f2328">Turn one-off commands into a verifiable loop</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#d0d7de"/>
<rect x="50" y="160" width="1100" height="500" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<path d="M 51 246 V 174 Q 51 161 64 161 H 1136 Q 1149 161 1149 174 V 246 Z" fill="#f6f8fa"/>
<line x1="50" y1="246" x2="1150" y2="246" stroke="#d0d7de"/>
<circle cx="84" cy="192" r="7" fill="#1a7f37"/>
<text x="106" y="200" class="group-title" fill="#1f2328">One operating loop</text>
<text x="106" y="228" class="small" fill="#59636e">Read broadly. Change narrowly. Prove the result against live state.</text>
<rect x="1019" y="183" width="107" height="32" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="1072.5" y="205" text-anchor="middle" class="badge" fill="#1a7f37">RECONCILE</text>
<line x1="415" y1="275" x2="415" y2="615" stroke="#d0d7de" stroke-width="1"/>
<line x1="785" y1="275" x2="785" y2="615" stroke="#d0d7de" stroke-width="1"/>
<line x1="80" y1="445" x2="1120" y2="445" stroke="#d0d7de" stroke-width="1"/>
<g id="truth">
<circle cx="95" cy="300" r="5" fill="#0969da"/>
<text x="112" y="307" class="title" fill="#1f2328">01 · Inventory</text>
<text x="112" y="347" class="body" fill="#59636e">Roles + ownership</text>
<text x="112" y="377" class="body" fill="#59636e">Desired state in Git</text>
<text x="112" y="407" class="body" fill="#59636e">Secrets referenced</text>
</g>
<g id="plan">
<circle cx="460" cy="300" r="5" fill="#1a7f37"/>
<text x="477" y="307" class="title" fill="#1f2328">02 · Discover + plan</text>
<text x="477" y="347" class="body" fill="#59636e">Read live state</text>
<text x="477" y="377" class="body" fill="#59636e">Reconcile differences</text>
<text x="477" y="407" class="body" fill="#59636e">Return exact preview</text>
</g>
<g id="gate">
<circle cx="830" cy="300" r="5" fill="#9a6700"/>
<text x="847" y="307" class="title" fill="#1f2328">03 · Policy gate</text>
<text x="847" y="347" class="body" fill="#59636e">Classify risk</text>
<text x="847" y="377" class="body" fill="#59636e">Name target + recovery</text>
<text x="847" y="407" class="body" fill="#59636e">Approve when required</text>
</g>
<g id="record">
<circle cx="95" cy="488" r="5" fill="#0969da"/>
<text x="112" y="495" class="title" fill="#1f2328">06 · Record evidence</text>
<text x="112" y="535" class="body" fill="#59636e">Structured result</text>
<text x="112" y="565" class="body" fill="#59636e">Versions + drift</text>
<text x="112" y="595" class="body" fill="#59636e">Runbook learning</text>
</g>
<g id="verify">
<circle cx="460" cy="488" r="5" fill="#1a7f37"/>
<text x="477" y="495" class="title" fill="#1f2328">05 · Verify live state</text>
<text x="477" y="535" class="body" fill="#59636e">Smoke tests</text>
<text x="477" y="565" class="body" fill="#59636e">Health + convergence</text>
<text x="477" y="595" class="body" fill="#59636e">Stop or roll back</text>
</g>
<g id="execute">
<circle cx="830" cy="488" r="5" fill="#bf3989"/>
<text x="847" y="495" class="title" fill="#1f2328">04 · Execute narrowly</text>
<text x="847" y="535" class="body" fill="#59636e">Typed service client</text>
<text x="847" y="565" class="body" fill="#59636e">Least privilege</text>
<text x="847" y="595" class="body" fill="#59636e">Timeouts + audit</text>
</g>
<path d="M 380 350 L 449 350" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="449,350 439,344 439,356" fill="#1a7f37"/>
<path d="M 745 350 L 819 350" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="819,350 809,344 809,356" fill="#1a7f37"/>
<path d="M 1115 410 L 1130 410 L 1130 470 L 1115 470" fill="none" stroke="#bf3989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1115,470 1125,464 1125,476" fill="#bf3989"/>
<path d="M 819 560 L 751 560" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="751,560 761,554 761,566" fill="#1a7f37"/>
<path d="M 449 560 L 386 560" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="386,560 396,554 396,566" fill="#1a7f37"/>
<path d="M 90 610 L 70 610 L 70 350 L 84 350" fill="none" stroke="#0969da" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="84,350 74,344 74,356" fill="#0969da"/>
<text x="600.0" y="756" text-anchor="middle" class="body" fill="#59636e">Recorded evidence feeds the next inventory and planning pass. The loop closes on truth, not intent.</text>
</svg>
