<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 880" width="1200" height="880">
<title id="title">Agentic homelab operations safety loop</title>
<desc id="desc">A bounded operations loop that observes, reconciles, plans, passes policy, executes through typed tools, verifies live state, and records evidence.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="880" fill="#ffffff"/>
<text x="52" y="54" class="eyebrow" fill="#0969da">AGENTIC OPERATIONS</text>
<text x="52" y="98" class="heading" fill="#1f2328">Put policy and typed tools between the model and the lab</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#d0d7de"/>
<rect x="50" y="160" width="1100" height="500" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<path d="M 51 246 V 174 Q 51 161 64 161 H 1136 Q 1149 161 1149 174 V 246 Z" fill="#f6f8fa"/>
<line x1="50" y1="246" x2="1150" y2="246" stroke="#d0d7de"/>
<circle cx="84" cy="192" r="7" fill="#bf3989"/>
<text x="106" y="200" class="group-title" fill="#1f2328">Guarded execution path</text>
<text x="106" y="228" class="small" fill="#59636e">The model proposes. Policy decides. Tools constrain. Live state proves.</text>
<rect x="1034" y="183" width="92" height="32" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="1080.0" y="205" text-anchor="middle" class="badge" fill="#bf3989">BOUNDED</text>
<line x1="325" y1="275" x2="325" y2="430" stroke="#d0d7de" stroke-width="1"/>
<line x1="595" y1="275" x2="595" y2="430" stroke="#d0d7de" stroke-width="1"/>
<line x1="865" y1="275" x2="865" y2="430" stroke="#d0d7de" stroke-width="1"/>
<line x1="80" y1="455" x2="1120" y2="455" stroke="#d0d7de" stroke-width="1"/>
<line x1="415" y1="485" x2="415" y2="615" stroke="#d0d7de" stroke-width="1"/>
<line x1="785" y1="485" x2="785" y2="615" stroke="#d0d7de" stroke-width="1"/>
<g id="observe">
<circle cx="87" cy="300" r="5" fill="#0969da"/>
<text x="104" y="307" class="title" fill="#1f2328">01 · Observe</text>
<text x="104" y="347" class="body" fill="#59636e">Bounded status reads</text>
<text x="104" y="377" class="body" fill="#59636e">Logs + health</text>
<text x="104" y="407" class="body" fill="#59636e">Untrusted evidence</text>
</g>
<g id="reconcile">
<circle cx="357" cy="300" r="5" fill="#1a7f37"/>
<text x="374" y="307" class="title" fill="#1f2328">02 · Reconcile</text>
<text x="374" y="347" class="body" fill="#59636e">Resolve inventory</text>
<text x="374" y="377" class="body" fill="#59636e">Cross-check systems</text>
<text x="374" y="407" class="body" fill="#59636e">Name uncertainty</text>
</g>
<g id="plan">
<circle cx="627" cy="300" r="5" fill="#9a6700"/>
<text x="644" y="307" class="title" fill="#1f2328">03 · Plan</text>
<text x="644" y="347" class="body" fill="#59636e">Typed inputs</text>
<text x="644" y="377" class="body" fill="#59636e">Narrow target</text>
<text x="644" y="407" class="body" fill="#59636e">Recovery path</text>
</g>
<g id="gate">
<circle cx="897" cy="300" r="5" fill="#cf222e"/>
<text x="914" y="307" class="title" fill="#1f2328">04 · Gate</text>
<text x="914" y="347" class="body" fill="#59636e">Preview parity</text>
<text x="914" y="377" class="body" fill="#59636e">Approval policy</text>
<text x="914" y="407" class="body" fill="#59636e">Iteration budget</text>
</g>
<g id="evidence">
<circle cx="95" cy="513" r="5" fill="#0969da"/>
<text x="112" y="520" class="title" fill="#1f2328">07 · Record evidence</text>
<text x="112" y="560" class="body" fill="#59636e">Auditable result</text>
<text x="112" y="590" class="body" fill="#59636e">Durable state</text>
<text x="112" y="620" class="body" fill="#59636e">Feed next decision</text>
</g>
<g id="verify">
<circle cx="460" cy="513" r="5" fill="#1a7f37"/>
<text x="477" y="520" class="title" fill="#1f2328">06 · Verify outcome</text>
<text x="477" y="560" class="body" fill="#59636e">Live state proof</text>
<text x="477" y="590" class="body" fill="#59636e">Smoke checks</text>
<text x="477" y="620" class="body" fill="#59636e">Stop or roll back</text>
</g>
<g id="execute">
<circle cx="830" cy="513" r="5" fill="#bf3989"/>
<text x="847" y="520" class="title" fill="#1f2328">05 · Execute via tools</text>
<text x="847" y="560" class="body" fill="#59636e">Least privilege</text>
<text x="847" y="590" class="body" fill="#59636e">Timeout + rate limit</text>
<text x="847" y="620" class="body" fill="#59636e">No shell by default</text>
</g>
<g id="rule">
<rect x="170" y="710" width="860" height="95" rx="16" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/>
<rect x="170" y="710" width="6" height="95" rx="3" fill="#cf222e"/>
<text x="198" y="752" class="title" fill="#1f2328">Autonomy is a budget, not a permanent permission grant</text>
<text x="198" y="786" class="body" fill="#59636e">Bound every objective with scope, time, iterations, cost, durable state, and a human stop condition.</text>
</g>
<path d="M 302 350 L 346 350" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="346,350 336,344 336,356" fill="#1a7f37"/>
<path d="M 572 350 L 616 350" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="616,350 606,344 606,356" fill="#1a7f37"/>
<path d="M 842 350 L 886 350" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="886,350 876,344 876,356" fill="#cf222e"/>
<path d="M 1115 410 L 1130 410 L 1130 485 L 1115 485" fill="none" stroke="#bf3989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1115,485 1125,479 1125,491" fill="#bf3989"/>
<path d="M 819 560 L 751 560" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="751,560 761,554 761,566" fill="#1a7f37"/>
<path d="M 449 560 L 386 560" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="386,560 396,554 396,566" fill="#1a7f37"/>
<path d="M 90 615 L 70 615 L 70 350 L 80 350" fill="none" stroke="#0969da" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="80,350 70,344 70,356" fill="#0969da"/>
<text x="600.0" y="856" text-anchor="middle" class="body" fill="#59636e">Classify risk by data sensitivity and operational cost as well as mutability.</text>
</svg>
