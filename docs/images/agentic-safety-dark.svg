<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 880" width="1200" height="880">
<title id="title">Agentic homelab operations safety loop</title>
<desc id="desc">A bounded operations loop that observes, reconciles, plans, passes policy, executes through typed tools, verifies live state, and records evidence.</desc>
<defs>
<style>
.eyebrow{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}
.heading{font-family:Arial,'Helvetica Neue',sans-serif;font-size:34px;font-weight:700}
.group-title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:25px;font-weight:700}
.title{font-family:Arial,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700}
.body{font-family:Arial,'Helvetica Neue',sans-serif;font-size:18px;font-weight:400}
.small{font-family:Arial,'Helvetica Neue',sans-serif;font-size:17px;font-weight:400}
.label{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.5px}
.badge{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.8px}
</style>
</defs>
<rect width="1200" height="880" fill="#0d1117"/>
<text x="52" y="54" class="eyebrow" fill="#58a6ff">AGENTIC OPERATIONS</text>
<text x="52" y="98" class="heading" fill="#e6edf3">Put policy and typed tools between the model and the lab</text>
<line x1="52" y1="126" x2="1148" y2="126" stroke="#30363d"/>
<rect x="50" y="160" width="1100" height="500" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M 51 246 V 174 Q 51 161 64 161 H 1136 Q 1149 161 1149 174 V 246 Z" fill="#161b22"/>
<line x1="50" y1="246" x2="1150" y2="246" stroke="#30363d"/>
<circle cx="84" cy="192" r="7" fill="#f778ba"/>
<text x="106" y="200" class="group-title" fill="#e6edf3">Guarded execution path</text>
<text x="106" y="228" class="small" fill="#9198a1">The model proposes. Policy decides. Tools constrain. Live state proves.</text>
<rect x="1034" y="183" width="92" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="1080.0" y="205" text-anchor="middle" class="badge" fill="#f778ba">BOUNDED</text>
<line x1="325" y1="275" x2="325" y2="430" stroke="#30363d" stroke-width="1"/>
<line x1="595" y1="275" x2="595" y2="430" stroke="#30363d" stroke-width="1"/>
<line x1="865" y1="275" x2="865" y2="430" stroke="#30363d" stroke-width="1"/>
<line x1="80" y1="455" x2="1120" y2="455" stroke="#30363d" stroke-width="1"/>
<line x1="415" y1="485" x2="415" y2="615" stroke="#30363d" stroke-width="1"/>
<line x1="785" y1="485" x2="785" y2="615" stroke="#30363d" stroke-width="1"/>
<g id="observe">
<circle cx="87" cy="300" r="5" fill="#58a6ff"/>
<text x="104" y="307" class="title" fill="#e6edf3">01 · Observe</text>
<text x="104" y="347" class="body" fill="#9198a1">Bounded status reads</text>
<text x="104" y="377" class="body" fill="#9198a1">Logs + health</text>
<text x="104" y="407" class="body" fill="#9198a1">Untrusted evidence</text>
</g>
<g id="reconcile">
<circle cx="357" cy="300" r="5" fill="#3fb950"/>
<text x="374" y="307" class="title" fill="#e6edf3">02 · Reconcile</text>
<text x="374" y="347" class="body" fill="#9198a1">Resolve inventory</text>
<text x="374" y="377" class="body" fill="#9198a1">Cross-check systems</text>
<text x="374" y="407" class="body" fill="#9198a1">Name uncertainty</text>
</g>
<g id="plan">
<circle cx="627" cy="300" r="5" fill="#d29922"/>
<text x="644" y="307" class="title" fill="#e6edf3">03 · Plan</text>
<text x="644" y="347" class="body" fill="#9198a1">Typed inputs</text>
<text x="644" y="377" class="body" fill="#9198a1">Narrow target</text>
<text x="644" y="407" class="body" fill="#9198a1">Recovery path</text>
</g>
<g id="gate">
<circle cx="897" cy="300" r="5" fill="#ff7b72"/>
<text x="914" y="307" class="title" fill="#e6edf3">04 · Gate</text>
<text x="914" y="347" class="body" fill="#9198a1">Preview parity</text>
<text x="914" y="377" class="body" fill="#9198a1">Approval policy</text>
<text x="914" y="407" class="body" fill="#9198a1">Iteration budget</text>
</g>
<g id="evidence">
<circle cx="95" cy="513" r="5" fill="#58a6ff"/>
<text x="112" y="520" class="title" fill="#e6edf3">07 · Record evidence</text>
<text x="112" y="560" class="body" fill="#9198a1">Auditable result</text>
<text x="112" y="590" class="body" fill="#9198a1">Durable state</text>
<text x="112" y="620" class="body" fill="#9198a1">Feed next decision</text>
</g>
<g id="verify">
<circle cx="460" cy="513" r="5" fill="#3fb950"/>
<text x="477" y="520" class="title" fill="#e6edf3">06 · Verify outcome</text>
<text x="477" y="560" class="body" fill="#9198a1">Live state proof</text>
<text x="477" y="590" class="body" fill="#9198a1">Smoke checks</text>
<text x="477" y="620" class="body" fill="#9198a1">Stop or roll back</text>
</g>
<g id="execute">
<circle cx="830" cy="513" r="5" fill="#f778ba"/>
<text x="847" y="520" class="title" fill="#e6edf3">05 · Execute via tools</text>
<text x="847" y="560" class="body" fill="#9198a1">Least privilege</text>
<text x="847" y="590" class="body" fill="#9198a1">Timeout + rate limit</text>
<text x="847" y="620" class="body" fill="#9198a1">No shell by default</text>
</g>
<g id="rule">
<rect x="170" y="710" width="860" height="95" rx="16" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
<rect x="170" y="710" width="6" height="95" rx="3" fill="#ff7b72"/>
<text x="198" y="752" class="title" fill="#e6edf3">Autonomy is a budget, not a permanent permission grant</text>
<text x="198" y="786" class="body" fill="#9198a1">Bound every objective with scope, time, iterations, cost, durable state, and a human stop condition.</text>
</g>
<path d="M 302 350 L 346 350" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="346,350 336,344 336,356" fill="#3fb950"/>
<path d="M 572 350 L 616 350" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="616,350 606,344 606,356" fill="#3fb950"/>
<path d="M 842 350 L 886 350" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="886,350 876,344 876,356" fill="#ff7b72"/>
<path d="M 1115 410 L 1130 410 L 1130 485 L 1115 485" fill="none" stroke="#f778ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1115,485 1125,479 1125,491" fill="#f778ba"/>
<path d="M 819 560 L 751 560" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="751,560 761,554 761,566" fill="#3fb950"/>
<path d="M 449 560 L 386 560" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="386,560 396,554 396,566" fill="#3fb950"/>
<path d="M 90 615 L 70 615 L 70 350 L 80 350" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="80,350 70,344 70,356" fill="#58a6ff"/>
<text x="600.0" y="856" text-anchor="middle" class="body" fill="#9198a1">Classify risk by data sensitivity and operational cost as well as mutability.</text>
</svg>
