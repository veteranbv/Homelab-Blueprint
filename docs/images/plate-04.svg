<?xml version="1.0" encoding="UTF-8"?>
<svg class="plate-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-plate-04 desc-plate-04" data-plate="plate-04" data-theme="light" data-failure="none" preserveAspectRatio="xMidYMid meet"><title id="title-plate-04">Plate 04, Recovery chain</title><desc id="desc-plate-04">A backup is a claim. A restore is evidence. Each stage crosses a failure boundary, keeps its own credentials, and leaves a dated record. A vertical stack of five filing tabs that shows the recovery chain from live application data through native export, encrypted repository, off-site copy, and canary restore, ending with a proven stamp. Each tab lists the invariant fields of an evidence record: what the stage holds, where its credential lives, and what verifies the transition to the next tab. The stack is marked example record synthetic. A left rule shows elapsed-time positions between stages. Margin notes name why each stage exists.</desc><defs><style>
    .plate-paper { fill: #F1EBDD; }
    .plate-paper-tint { fill: #E6DECA; }
    .plate-paper-elevated { fill: #F7F1E1; }
    .plate-ink { fill: #181613; }
    .plate-ink-soft { fill: #7A7261; }
    .plate-warn { fill: #A83521; }
    .plate-verify { fill: #2B5D4A; }
    .plate-stroke { stroke: #181613; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-soft { stroke: #7A7261; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-hairline { stroke: #BFB49B; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-warn { stroke: #A83521; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-stroke-verify { stroke: #2B5D4A; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .plate-fill-paper { fill: #F1EBDD; }
    .plate-fill-tint { fill: #E6DECA; }
    .plate-fill-elevated { fill: #F7F1E1; }
    .w05 { stroke-width: 0.6; }
    .w1  { stroke-width: 1.1; }
    .w15 { stroke-width: 1.6; }
    .w25 { stroke-width: 2.4; }
    .w4  { stroke-width: 3.6; }
    .t-plate-number { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; fill: #181613; }
    .t-plate-name   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #7A7261; }
    .t-plate-title  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.02em; fill: #181613; }
    .t-teaching     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 19px; fill: #181613; }
    .t-revision     { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; letter-spacing: 0.08em; fill: #7A7261; }
    .t-callout      { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 15px; fill: #181613; }
    .t-label        { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #181613; }
    .t-label-soft   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: #7A7261; }
    .t-body         { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #181613; }
    .t-body-soft    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 13px; fill: #7A7261; }
    .t-mono         { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #181613; }
    .t-mono-soft    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 12px; fill: #7A7261; }
    .t-mono-small   { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 10px; fill: #7A7261; letter-spacing: 0.06em; }
    .t-stamp        { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .t-question     { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 28px; fill: #181613; }
    .t-question-hint{ font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 12px; letter-spacing: 0.02em; fill: #7A7261; }
    .t-destination  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;  font-size: 15px; font-weight: 700; letter-spacing: 0.06em; fill: #181613; }
    .t-consequence  { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 13px; fill: #7A7261; }
    .t-footer       { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, ui-serif, Georgia, serif; font-style: italic; font-size: 17px; fill: #181613; }
    .t-anchor       { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;  font-size: 11px; font-weight: 700; fill: #181613; letter-spacing: 0.02em; }
    .fade-in        { opacity: 1;  }
    .fade-in.d-1    { animation-delay: 260ms; }
    .fade-in.d-2    { animation-delay: 340ms; }
    .fade-in.d-3    { animation-delay: 420ms; }
    .fade-in.d-4    { animation-delay: 500ms; }
    .fade-in.d-5    { animation-delay: 580ms; }
    .cursor         {  }
    .failure-stamp  { transform-origin: center;  }
    @keyframes plate-fade { to { opacity: 1; } }
    @keyframes plate-blink { 50% { opacity: 0; } }
    @keyframes plate-stamp { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .failure-stamp { animation: none !important; opacity: 1 !important; }
      .cursor { animation: none !important; }
    }
  </style><filter id="ink-plate-04" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="0.45"></feDisplacementMap></filter><pattern id="grid-plate-04" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 16 0 L 0 0 0 16" stroke="#BFB49B" stroke-opacity="0.22" stroke-width="0.5" fill="none"></path></pattern></defs><rect width="1600" height="1000" class="plate-paper"></rect><rect x="48" y="48" width="1504" height="904" fill="url(#grid-plate-04)"></rect><g class="title-block"><line x1="48" y1="108" x2="1552" y2="108" class="plate-stroke w1"></line><text x="48" y="74" class="t-plate-number">PLATE 04</text><text x="48" y="96" class="t-plate-name">Data protection</text><text x="1552" y="74" text-anchor="end" class="t-plate-title">Recovery chain</text><g><rect x="1384" y="82" width="168" height="22" fill="none" class="plate-stroke-soft w1"></rect><text x="1468" y="98" text-anchor="middle" class="t-revision">REV 2026-07</text></g></g><g filter="url(#ink-plate-04)" class="plate-body"><g><line x1="120" y1="190" x2="120" y2="770" class="plate-stroke w1"></line><text x="120" y="176" text-anchor="middle" class="t-label-soft">EARLIER</text><text x="120" y="792" text-anchor="middle" class="t-label-soft">LATER</text><g><line x1="110" y1="233" x2="130" y2="233" class="plate-stroke w15"></line><text x="100" y="237" text-anchor="end" class="t-mono-small">t1</text></g><g><line x1="110" y1="351" x2="130" y2="351" class="plate-stroke w15"></line><text x="100" y="355" text-anchor="end" class="t-mono-small">t2</text></g><g><line x1="110" y1="469" x2="130" y2="469" class="plate-stroke w15"></line><text x="100" y="473" text-anchor="end" class="t-mono-small">t3</text></g><g><line x1="110" y1="587" x2="130" y2="587" class="plate-stroke w15"></line><text x="100" y="591" text-anchor="end" class="t-mono-small">t4</text></g><g><line x1="110" y1="705" x2="130" y2="705" class="plate-stroke w15"></line><text x="100" y="709" text-anchor="end" class="t-mono-small">t5</text></g></g><g class="fade-in d-1"><rect x="180" y="180" width="940" height="106" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M 1036 180 L 1056 160 L 1120 160 L 1120 180 Z" class="plate-stroke w15 plate-fill-elevated"></path><text x="1078" y="175" text-anchor="middle" class="t-mono-small">01</text><text x="200" y="210" class="t-label">LIVE APPLICATION DATA</text><text x="200" y="236" class="t-body"><tspan class="t-label-soft">HOLDS </tspan><tspan>the working state a person or service depends on today</tspan></text><text x="200" y="256" class="t-body"><tspan class="t-label-soft">CREDENTIAL </tspan><tspan>the application runtime identity</tspan></text><text x="200" y="276" class="t-body"><tspan class="t-label-soft">VERIFIED BY </tspan><tspan>reachability of the service that owns the data</tspan></text><text x="200" y="296" class="t-mono-small">↓  application-consistent export, ordered by dependency</text></g><g class="fade-in d-2"><rect x="180" y="298" width="940" height="106" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M 1036 298 L 1056 278 L 1120 278 L 1120 298 Z" class="plate-stroke w15 plate-fill-elevated"></path><text x="1078" y="293" text-anchor="middle" class="t-mono-small">02</text><text x="200" y="328" class="t-label">NATIVE EXPORT</text><text x="200" y="354" class="t-body"><tspan class="t-label-soft">HOLDS </tspan><tspan>a portable file the application can reload</tspan></text><text x="200" y="374" class="t-body"><tspan class="t-label-soft">CREDENTIAL </tspan><tspan>the export tool identity, distinct from the runtime</tspan></text><text x="200" y="394" class="t-body"><tspan class="t-label-soft">VERIFIED BY </tspan><tspan>file size, row count, or manifest matches expectation</tspan></text><text x="200" y="414" class="t-mono-small">↓  write to an encrypted repository with versioned snapshots</text></g><g class="fade-in d-3"><rect x="180" y="416" width="940" height="106" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M 1036 416 L 1056 396 L 1120 396 L 1120 416 Z" class="plate-stroke w15 plate-fill-elevated"></path><text x="1078" y="411" text-anchor="middle" class="t-mono-small">03</text><text x="200" y="446" class="t-label">ENCRYPTED REPOSITORY</text><text x="200" y="472" class="t-body"><tspan class="t-label-soft">HOLDS </tspan><tspan>deduplicated, versioned snapshots and a freshness heartbeat</tspan></text><text x="200" y="492" class="t-body"><tspan class="t-label-soft">CREDENTIAL </tspan><tspan>the backup tool identity, held separately from application secrets</tspan></text><text x="200" y="512" class="t-body"><tspan class="t-label-soft">VERIFIED BY </tspan><tspan>the last snapshot is fresh and its checksum is intact</tspan></text><text x="200" y="532" class="t-mono-small">↓  ship a copy to a separate failure domain</text></g><g class="fade-in d-4"><rect x="180" y="534" width="940" height="106" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M 1036 534 L 1056 514 L 1120 514 L 1120 534 Z" class="plate-stroke w15 plate-fill-elevated"></path><text x="1078" y="529" text-anchor="middle" class="t-mono-small">04</text><text x="200" y="564" class="t-label">OFF-SITE OR OFFLINE COPY</text><text x="200" y="590" class="t-body"><tspan class="t-label-soft">HOLDS </tspan><tspan>an independent copy that survives a local disaster</tspan></text><text x="200" y="610" class="t-body"><tspan class="t-label-soft">CREDENTIAL </tspan><tspan>the off-site identity, unable to reach the primary</tspan></text><text x="200" y="630" class="t-body"><tspan class="t-label-soft">VERIFIED BY </tspan><tspan>the copy list matches the origin and cannot be silently deleted</tspan></text><text x="200" y="650" class="t-mono-small">↓  restore a canary somewhere other than the source</text></g><g class="fade-in d-5"><rect x="180" y="652" width="940" height="106" class="plate-stroke w15 plate-fill-elevated"></rect><path d="M 1036 652 L 1056 632 L 1120 632 L 1120 652 Z" class="plate-stroke w15 plate-fill-elevated"></path><text x="1078" y="647" text-anchor="middle" class="t-mono-small">05</text><text x="200" y="682" class="t-label">PROVEN RESTORE</text><text x="200" y="708" class="t-body"><tspan class="t-label-soft">HOLDS </tspan><tspan>a dated record of a real restore on a clean target</tspan></text><text x="200" y="728" class="t-body"><tspan class="t-label-soft">CREDENTIAL </tspan><tspan>a canary identity that never touches production</tspan></text><text x="200" y="748" class="t-body"><tspan class="t-label-soft">VERIFIED BY </tspan><tspan>checksum match and a smoke test the application defines</tspan></text><g class="failure-stamp" transform="translate(990 705) rotate(-4)"><rect x="-84" y="-20" width="168" height="40" fill="none" class="plate-stroke-verify w25"></rect><text y="6" text-anchor="middle" class="t-stamp plate-verify" fill="#2B5D4A">PROVEN, DATED</text></g></g><g><line x1="1164" y1="190" x2="1164" y2="770" class="plate-stroke-hairline w05"></line><text x="1180" y="176" class="t-label-soft">FIELD ANNOTATIONS</text><g class="fade-in d-1"><text x="1180" y="211" class="t-label-soft">ON LIVE DATA</text><text x="1180" y="231" class="t-callout">The application owns this.</text><text x="1180" y="249" class="t-callout">Every step below survives</text><text x="1180" y="267" class="t-callout">it.</text><line x1="1180" y1="280" x2="1544" y2="280" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-2"><text x="1180" y="329" class="t-label-soft">ON EXPORT</text><text x="1180" y="349" class="t-callout">The application must be</text><text x="1180" y="367" class="t-callout">quiet, not writing, when</text><text x="1180" y="385" class="t-callout">the export runs.</text><line x1="1180" y1="398" x2="1544" y2="398" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-3"><text x="1180" y="447" class="t-label-soft">ON REPOSITORY</text><text x="1180" y="467" class="t-callout">The repository credential</text><text x="1180" y="485" class="t-callout">is not the application</text><text x="1180" y="503" class="t-callout">credential.</text><line x1="1180" y1="516" x2="1544" y2="516" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-4"><text x="1180" y="565" class="t-label-soft">ON OFF-SITE</text><text x="1180" y="585" class="t-callout">The copy is worth what it</text><text x="1180" y="603" class="t-callout">can be restored from, not</text><text x="1180" y="621" class="t-callout">what it holds.</text><line x1="1180" y1="634" x2="1544" y2="634" class="plate-stroke-hairline w05"></line></g><g class="fade-in d-5"><text x="1180" y="683" class="t-label-soft">ON PROVEN</text><text x="1180" y="703" class="t-callout">A restore record on a</text><text x="1180" y="721" class="t-callout">clean target is the only</text><text x="1180" y="739" class="t-callout">proof that stands.</text><line x1="1180" y1="752" x2="1544" y2="752" class="plate-stroke-hairline w05"></line></g></g><g><rect x="48" y="796" width="1504" height="148" class="plate-stroke w15 plate-fill-elevated"></rect><text x="68" y="824" class="t-label">A RESTORE RECORD LOOKS LIKE THIS</text><text x="1532" y="824" text-anchor="end" class="t-stamp plate-warn" fill="#A83521">EXAMPLE RECORD, SYNTHETIC</text><line x1="68" y1="836" x2="1532" y2="836" class="plate-stroke-hairline w05"></line><text x="68" y="866" class="t-mono">date=YYYY-MM-DD    source=SVC HOST    target=CANARY HOST    bytes=NNN GiB</text><text x="68" y="890" class="t-mono">checksum=match    elapsed=HH:MM:SS    note=free-text field the operator fills in</text><text x="68" y="920" class="t-body-soft">Real records replace the placeholders. Values that would identify the lab stay out of public evidence.</text></g></g></svg>
