name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Supersede obsolete pull request validation only; every master run completes.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Successful runs take about two minutes.
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Lint site
        run: npm run lint
      - name: Type-check site
        run: npm run typecheck
      - name: Test site logic
        run: npm run test
      - name: Build site
        env:
          DEPLOY_TARGET: cloudflare
        run: npm run build
      - name: Test site experience
        run: npm run test:e2e
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Test the review evaluator
        # Stdlib-only smoke test of the vendored review gate evaluator.
        run: python3 -I .github/scripts/test_review_contract.py

      - name: Install zizmor
        env:
          # Version and checksum are from the upstream v1.31.1 release assets.
          ZIZMOR_VERSION: "1.31.1"
          ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
        run: |
          set -euo pipefail
          # Outside the workspace, so later clean-tree checks are unaffected.
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor

      - name: Audit workflow security
        # Offline static audit: privileged triggers, injection, credential
        # persistence, cache poisoning and permissions. Intentional exceptions
        # carry an inline reason.
        run: '"$RUNNER_TEMP/zizmor" --offline .github/workflows'

      - name: Check generated plates
        run: npm run render:plates:check
      - name: Validate recommendation metadata
        run: python3 scripts/audit_recommendations.py --offline
      - name: Check local links
        run: python3 scripts/check_links.py
      - name: Scan for private identifiers
        run: python3 scripts/check_privacy.py
